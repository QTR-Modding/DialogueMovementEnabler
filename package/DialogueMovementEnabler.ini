[General]
bEnabled=1

[Dialogue]
; What you can do while talking
bAllowMovement=1
bAllowRunning=0
bAllowJumping=0
bAllowSneaking=0
; Switch between first and third person
bAllowPOVSwitch=0
; Extra details in the log, for troubleshooting
bDebugLog=0

[AutoClose]
; End the conversation when you walk away
bAutoClose=1
; Metres
fAutoCloseDistance=19
; Extra distance for conversations started from further away
fAutoCloseTolerance=6

[Camera]
; Hold the left mouse button outside the dialogue box to look around
bDragRotation=1
; No cursor: the mouse always looks around. Pick replies with the arrow keys,
; number keys or the activate key. Replaces bDragRotation and bEdgeRotation.
; Tip: bind Menu Navigation Up/Down to the mouse wheel in the game's key bindings
; to pick replies with the wheel.
bFreeLook=0
; Look around by pushing the cursor against a screen edge. Not used with bFreeLook.
bEdgeRotation=0
; Edge area, as a share of the screen (0-0.5)
fEdgeSize=0.12
fEdgeSizeBottom=0.03
fEdgeSpeed=12
